# DE1-SoC — Cyclone V HPS (Cortex-A9) via USB-Blaster II
source [find openocd/altera-usb-blaster2.cfg]

adapter speed 3000

reset_config none

# JTAG chain (OpenOCD order = TDI first):
#   pos 0: Cyclone V 02D120DD  — FPGA TAP    (IR len 10)
#   pos 1: SOCVHPS   4BA00477  — ARM JTAG-DP (IR len  4)
jtag newtap cv     fpga -irlen 10 -expected-id 0x02d120dd
jtag newtap cv_hps dap  -irlen 4  -expected-id 0x4ba00477

dap create cv_hps.dap -chain-position cv_hps.dap

# Cortex-A9 core 0 — debug base from Cyclone V TRM
target create cv_hps.cpu cortex_a -dap cv_hps.dap -coreid 0 -dbgbase 0x80110000

cv_hps.cpu configure \
    -work-area-phys 0xffff0000 \
    -work-area-size 0x10000    \
    -work-area-backup 0

cv_hps.cpu configure -event reset-init {
    cortex_a dbginit
}

# Cortex-A9 core 1 — debug base = core 0 + 0x2000 (per-core debug regs are 0x2000 apart)
target create cv_hps.cpu1 cortex_a -dap cv_hps.dap -coreid 1 -dbgbase 0x80112000

cv_hps.cpu1 configure -event reset-init {
    cortex_a dbginit
}

# Keep core 0 as the default current target (bare halt/reg/bp commands hit CPU0).
targets cv_hps.cpu
